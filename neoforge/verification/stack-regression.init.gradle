gradle.projectsEvaluated {
    def project = gradle.rootProject
    def regression = project.sourceSets.create('stackRegression') {
        java.srcDir('verification/src')
        compileClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
        runtimeClasspath += project.sourceSets.main.output + project.sourceSets.main.runtimeClasspath
    }
    project.tasks.register('verifyStorageMatching', JavaExec) {
        dependsOn project.tasks.named(regression.classesTaskName)
        classpath = regression.runtimeClasspath
        mainClass = 'net.xuwu.bettersophisticatedstorage.common.StorageMatchingRegression'
        javaLauncher = project.javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    project.tasks.register('printVerificationClasspath') {
        doLast {
            project.sourceSets.main.runtimeClasspath.files.each { println(it.absolutePath) }
        }
    }
}
